name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK using official kivy/buildozer Docker image
        run: |
          docker run \
            --volume "${{ github.workspace }}":/home/user/hostcwd \
            --workdir /home/user/hostcwd \
            kivy/buildozer:latest \
            android debug 2>&1 | tee build.log
          # exit with buildozer's real exit code, not tee's
          exit "${PIPESTATUS[0]}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gym-register-apk
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

