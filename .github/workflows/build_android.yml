name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Python 3.12
      # --------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 3. Android / Buildozer system dependencies
      # --------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint

      # --------------------------------------------------
      # 4. Install Buildozer
      # --------------------------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "buildozer @ git+https://github.com/kivy/buildozer.git@master" \
            "cython==0.29.34" \
            setuptools \
            virtualenv

      # --------------------------------------------------
      # 5. Show versions / verify environment
      # --------------------------------------------------
      - name: Verify environment
        run: |
          echo "=============================="
          echo "Python"
          echo "=============================="
          python --version

          echo "=============================="
          echo "Buildozer"
          echo "=============================="
          buildozer --version

          echo "=============================="
          echo "Cython"
          echo "=============================="
          cython --version

          echo "=============================="
          echo "Repository"
          echo "=============================="
          pwd
          ls -la

          echo "=============================="
          echo "Buildozer spec"
          echo "=============================="
          test -f buildozer.spec
          ls -lh buildozer.spec

      # --------------------------------------------------
      # 6. Build APK
      # --------------------------------------------------
      - name: Build APK
        run: |
          set -eux

          echo "=============================="
          echo "Starting Buildozer"
          echo "=============================="

          buildozer -v android debug

      # --------------------------------------------------
      # 7. Find APK
      # --------------------------------------------------
      - name: Find generated APK
        if: always()
        run: |
          echo "=============================="
          echo "Searching for APK files"
          echo "=============================="

          find . -type f -name "*.apk" -print || true

          echo "=============================="
          echo "Searching for AAB files"
          echo "=============================="

          find . -type f -name "*.aab" -print || true

      # --------------------------------------------------
      # 8. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gym-register-apk
          path: |
            **/*.apk
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 9. Upload buildozer directory if build fails
      # --------------------------------------------------
      - name: Upload build artifacts for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug
          path: |
            .buildozer/
            buildozer.spec
          if-no-files-found: warn
          retention-days: 7