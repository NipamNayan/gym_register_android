name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Python 3.10 (Tested for p4a host recipe compatibility)
      # --------------------------------------------------
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # --------------------------------------------------
      # Java 17 (Required by Android Gradle Plugin)
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Java 17 system-wide
        run: |
          sudo update-alternatives --set java /usr/lib/jvm/temurin-17-jdk-amd64/bin/java 2>/dev/null || true
          sudo update-alternatives --set javac /usr/lib/jvm/temurin-17-jdk-amd64/bin/javac 2>/dev/null || true
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      # --------------------------------------------------
      # System dependencies required by Buildozer
      # --------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev gettext autopoint

      # --------------------------------------------------
      # Install Buildozer & Cython
      # --------------------------------------------------
      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer @ git+https://github.com/kivy/buildozer.git@master"
          pip install "cython==0.29.36"
          pip install setuptools virtualenv

      # --------------------------------------------------
      # Build APK
      # --------------------------------------------------
      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug 2>&1 | tee buildozer.log
          exit "${PIPESTATUS[0]}"
        shell: bash

      # --------------------------------------------------
      # Print failure log tail
      # --------------------------------------------------
      - name: Print failure log tail
        if: failure()
        run: |
          echo "====================== BUILD LOG TAIL ======================"
          tail -n 250 buildozer.log || true
          echo "============================================================"

      # --------------------------------------------------
      # Upload full build log
      # --------------------------------------------------
      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
          if-no-files-found: warn

      # --------------------------------------------------
      # Upload APK
      # --------------------------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gym-register-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # Upload Buildozer files if build fails
      # --------------------------------------------------
      - name: Upload build files for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug
          path: |
            .buildozer/
            buildozer.spec
          if-no-files-found: warn
          retention-days: 7